name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npx vite build --mode pages --base="${{ steps.pages.outputs.base_path }}/"
        env:
          # HTTPS origin of the self-hosted API. With it set, the site is the
          # private app (sign-in required, service worker included); unset, it
          # is a demo that plays the bundled reels. Vite reads prefixed env vars
          # after .env.pages, so this wins when it is set.
          VITE_API_ORIGIN: ${{ vars.VITE_API_ORIGIN }}

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages has no server-side rewrite, so a deep link such as
          # /videoscroll/likes has no file to serve. Pages falls back to
          # 404.html, from which the client router resolves the path.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
