name: Server (Go) and end-to-end

# Not path-filtered to server/: the e2e job exercises the frontend too.
on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # The pipeline integration tests run real ffmpeg against videos/clip1.mp4.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::12}" -o ../dist-server/videoscroll ./cmd/videoscroll

      # Download from the run page, then: sudo ./deploy/install.sh videoscroll
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: videoscroll-linux-amd64
          path: dist-server/videoscroll
          retention-days: 30

  # A typo in the Caddyfile only shows up when the PC reloads Caddy, which
  # takes the site down. Catch it here instead.
  caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deploy/Caddyfile
        run: >
          docker run --rm -v "$PWD/deploy:/etc/caddy:ro" caddy:2
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  # The whole production topology locally (scripts/simulate.mjs): Pages build
  # + Go API on separate origins, driven by real Chrome.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: npm ci

      # Google Chrome rather than bundled Chromium: the videos are H.264.
      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
